# eero Custom Dashboard - Synology Container Manager (DSM 7.2+)
# Setup and update steps: see README.md in this folder.
#
# pull_policy: always makes every `docker compose up` (Container Manager
# Project -> Start or Action -> Build) check Docker Hub for a newer :latest
# before starting. A plain container restart or a NAS reboot does NOT pull;
# use the Task Scheduler job in README.md to cover those.

services:
  eero-dashboard:
    image: enricoflammini/eero-dashboard:latest
    pull_policy: always            # pull newest :latest on every project start/build
    container_name: eero-dashboard
    restart: unless-stopped
    stop_grace_period: 30s         # let the app close SQLite cleanly before recreate
    ports:
      - "8085:8000"
    volumes:
      - /volume1/docker/eeroDashboard/data:/app/data
    environment:
      - TZ=America/New_York
      - DATA_DIR=/app/data
      - POLL_INTERVAL=30
      - SPEEDTEST_INTERVAL_HOURS=12   # 0 disables scheduled speed tests
      - HISTORY_RETENTION_DAYS=30
      - DEMO_MODE=false
      - API_DOCS=false
      # Leave these blank to use the setup wizard on first launch.
      - ADMIN_USER=
      - ADMIN_PASSWORD=
      # Optional: skip the OTP login by pasting user_token from data/session.json.
      - EERO_USER_TOKEN=
      - EERO_NETWORK_ID=
      # Optional notifications
      - TELEGRAM_BOT_TOKEN=
      - TELEGRAM_CHAT_ID=
      - WEBHOOK_URL=
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 512m
